{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <img src="{% static 'images/DietCraft Logo.png' %}" class="auth-logo">
        <h2>Email Verification</h2>
        <p>Enter the 6-digit OTP sent to your email.</p>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="otp" maxlength="6" class="auth-input" placeholder="Enter OTP">
            <button type="submit" class="auth-btn">Verify</button>
        </form>
        
        {% if pending_id %}
        <a class="outline-btn" href="{% url 'resend_otp' pending_id %}">Resend OTP</a>
        <a class="outline-btn" href="{% url 'signup' %}?email={{ pending_email|urlencode }}&username={{ pending_username|urlencode }}">Change Email</a>
        {% endif %}
    </div>
</div>
{% endblock %}
{% block extra_js %}{% endblock %}
